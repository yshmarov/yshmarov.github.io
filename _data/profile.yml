strengths:
  - title: Payments and billing
    text: "Subscriptions, one-time and usage-based billing, marketplaces and payouts. Stripe in production for years; I wrote the <a href='https://whop.com/start/?code=CAKARK' rel='sponsored nofollow'>Whop</a> adapter for Rails' Pay gem."
  - title: Native mobile
    text: "iOS in Swift, Android in Kotlin, and Hotwire Native when a web view is the right call. Including the unglamorous part: signing, release tooling, store review."
  - title: AI products
    text: "Chat products with tools, memory and background routines; MCP servers; agent-ready codebases where an agent can work unsupervised and I review."
  - title: Multi-tenant SaaS
    text: "Organizations, roles, invitations, audit logs, authorization that holds. I maintain an open-source foundation for it and build my own products on it."
  - title: Zero to shipped
    text: "From an empty repository to production with tests, CI, deploys, monitoring and docs. I do the whole thing, not a slice of it."

